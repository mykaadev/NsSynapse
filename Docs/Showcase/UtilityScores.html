<!-- Showcase for the website: the docs link to this file, and the site turns the lists into live score bars. -->
<figure class="ns-utility">
  <figcaption>One agent with four example actions. Each consideration reads one input and maps it through its curve. The brain clamps each result to 0..1, adds the make-up term, and multiplies the results of an action. It picks the action with the highest score. On a tie, the first action in the list wins. The example curves use linear keys. Move the inputs to see the choice change.</figcaption>
  <ul class="ns-utility-inputs">
    <li data-input="Hunger" data-value="0.7"><b>Hunger</b> 0.7</li>
    <li data-input="Danger" data-value="0.3"><b>Danger</b> 0.3</li>
    <li data-input="Distance" data-value="0.5" data-hint="0 is near"><b>Distance</b> 0.5, the distance to the enemy (0 is near)</li>
    <li data-input="Health" data-value="0.8"><b>Health</b> 0.8</li>
  </ul>
  <ol class="ns-utility-actions">
    <li data-action="Eat"><b>Eat</b>
      <ul>
        <li data-input="Hunger" data-curve="0,0 1,1">Hunger, curve keys (0, 0) (1, 1)</li>
        <li data-input="Danger" data-curve="0,1 0.5,0.6 1,0">Danger, curve keys (0, 1) (0.5, 0.6) (1, 0)</li>
      </ul>
    </li>
    <li data-action="Flee"><b>Flee</b>
      <ul>
        <li data-input="Danger" data-curve="0,0 0.5,0.2 1,1">Danger, curve keys (0, 0) (0.5, 0.2) (1, 1)</li>
        <li data-input="Health" data-curve="0,1 1,0">Health, curve keys (0, 1) (1, 0)</li>
      </ul>
    </li>
    <li data-action="Attack"><b>Attack</b>
      <ul>
        <li data-input="Distance" data-curve="0,1 0.6,0.3 1,0">Distance, curve keys (0, 1) (0.6, 0.3) (1, 0)</li>
        <li data-input="Health" data-curve="0,0 0.5,0.8 1,1">Health, curve keys (0, 0) (0.5, 0.8) (1, 1)</li>
        <li data-input="Danger" data-curve="0,0.2 0.5,1 1,0.6">Danger, curve keys (0, 0.2) (0.5, 1) (1, 0.6)</li>
      </ul>
    </li>
    <li data-action="Rest"><b>Rest</b>
      <ul>
        <li data-input="Danger" data-curve="0,0.5 0.4,0 1,0">Danger, curve keys (0, 0.5) (0.4, 0) (1, 0)</li>
      </ul>
    </li>
  </ol>
</figure>
